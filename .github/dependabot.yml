# Weekly dependency updates as PRs into develop (main only receives releases).
version: 2
updates:
  - package-ecosystem: "uv" # pyproject.toml + uv.lock
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    labels: ["dependencies", "type:chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    labels: ["dependencies", "type:ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
