name: Mutation testing

# Coverage says the code runs; mutation testing says the tests would catch a bug.
# Weekly and on demand, never blocking: the score and the surviving mutants go to the
# job summary. Reviewed survivors are documented in docs/mutation-testing.md.
on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 06:00 in Lima (UTC-5), on the default branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  mutmut:
    name: mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Run mutmut
        # Non-blocking by design: a low score is a signal to review, not a failed build.
        continue-on-error: true
        run: uv run mutmut run --max-children 4
      - name: Write the summary
        if: always()
        run: |
          uv run mutmut export-cicd-stats || true
          uv run mutmut results > mutants/results.txt || true
          uv run python scripts/mutation_summary.py mutants/mutmut-cicd-stats.json \
            mutants/results.txt docs/mutation-testing.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the survivors list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-results
          path: |
            mutants/results.txt
            mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
          retention-days: 30
